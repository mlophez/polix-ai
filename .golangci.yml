# golangci-lint of polix: the standard linters (errcheck, govet, ineffassign, staticcheck, unused), the linters of
# idiomatic Go below, importas, depguard with the import lists of the architecture rules, and the gofmt and goimports
# formatters. polix.yaml runs it on stop and CI on every system (version pinned in .github/workflows/ci.yml).
version: "2"
linters:
  default: standard
  enable:
    - importas
    # The import lists of the architecture rules GOARCH-41 to GOARCH-43 (see settings.depguard).
    - depguard
    # Errors: a checked error that returns nil, %v instead of %w, a comparison instead of errors.Is or errors.As.
    - nilerr
    - errorlint
    # Idioms and style: names, receivers, unused parameters, shadowed builtins (revive, successor of golint).
    - revive
    # Newer APIs of the standard library over hand-written loops (slices, maps, min, max, range over int).
    - modernize
    # Results and parameters that are always the same, and conversions that do nothing.
    - unparam
    - unconvert
    # fmt where a plain concatenation or errors.New does, constants of net/http over literals.
    - perfsprint
    - usestdlibvars
    # A //nolint must name the linter and say why, and must still silence something.
    - nolintlint
    # The limits of complexity of GO-4 (see settings.gocyclo and settings.gocognit); its limit of the length of a
    # file is the rule file-length-limit of revive.
    - gocyclo
    - gocognit
  settings:
    importas:
      # A use case is imported as <noun><verb> (internal/app/rule/check as rulecheck): one pattern covers every use
      # case, and an import without the alias fails. Only the use cases have a pattern: with no-unaliased, one for
      # the domains or the libraries would demand an alias on every import of them (platformgit for
      # internal/platform/git), so they are imported without alias.
      no-unaliased: true
      alias:
        - pkg: ^github\.com/mlophez/polix-ai/internal/app/(\w+)/(\w+)$
          alias: $1$2
    depguard:
      # The import lists of the architecture rules of ai/rules/architecture.yaml, each named after its rule so a
      # finding names it (golangci-lint prints the name in lower case); tests/architecture runs depguard alone to
      # decide them, on this repository and on tests/architecture/testdata/depguard. A file glob with a single *
      # does not cross /. deny wins over allow, a list with allow denies what it does not allow, and an entry ending
      # in $ is that package alone, else the package and every package below it. The import rules that depend on the
      # layout (GOARCH-9: a use case never imports another, a helper only from its use case) stay in the AST tests,
      # since depguard matches packages only by prefix and would need one entry per use case.
      rules:
        # GOARCH-41: the domain imports the standard library but what touches the outside, the randomness and the
        # logs; internal/app/ (GOARCH-9 decides which); the pure libraries of internal/platform/; yaml and the
        # templates. A new library of internal/platform/ is denied until it is added here on purpose.
        GOARCH-41-domain:
          files: ["**/internal/app/*/*.go", "!$test"]
          allow: &goarch41-allow
            - $gostd
            - github.com/mlophez/polix-ai/internal/app
            - github.com/mlophez/polix-ai/internal/platform/glob$
            - github.com/mlophez/polix-ai/internal/platform/semver$
            - github.com/mlophez/polix-ai/internal/platform/shell$
            - github.com/mlophez/polix-ai/internal/platform/text$
            - github.com/mlophez/polix-ai/internal/platform/yamlfmt$
            - github.com/mlophez/polix-ai/templates$
            - gopkg.in/yaml.v3$
          deny:
            - pkg: os$
              desc: &outside >-
                GOARCH-41: the domain and the logic never touch the outside; the adapter does it through the port
            - { pkg: os/exec$, desc: *outside }
            - { pkg: os/signal$, desc: *outside }
            - { pkg: net$, desc: *outside }
            - { pkg: net/http$, desc: *outside }
            - { pkg: io/fs$, desc: *outside }
            - { pkg: runtime$, desc: *outside }
            - { pkg: syscall$, desc: *outside }
            - pkg: math/rand$
              desc: &random >-
                GOARCH-41: the domain and the logic are deterministic; the adapter draws the random value
            - { pkg: math/rand/v2$, desc: *random }
            - { pkg: crypto/rand$, desc: *random }
            - pkg: log$
              desc: &logs >-
                GOARCH-41: the domain and the logic do not log; they return what happened and the shell reports it
            - { pkg: log/slog$, desc: *logs }
        # GOARCH-41: the logic files of a use case, logic.go and its siblings logic_<topic>.go, import what the domain
        # does, and never context. GOARCH-4 reads this list to check the helpers that the logic imports.
        GOARCH-41-logic:
          files: ["**/internal/app/*/*/logic.go", "**/internal/app/*/*/logic_*.go", "!$test"]
          allow: *goarch41-allow
          deny:
            - pkg: context$
              desc: >-
                GOARCH-41: the logic does no input nor output to cancel; the context stays in the shell and the adapter
            - { pkg: os$, desc: *outside }
            - { pkg: os/exec$, desc: *outside }
            - { pkg: os/signal$, desc: *outside }
            - { pkg: net$, desc: *outside }
            - { pkg: net/http$, desc: *outside }
            - { pkg: io/fs$, desc: *outside }
            - { pkg: runtime$, desc: *outside }
            - { pkg: syscall$, desc: *outside }
            - { pkg: math/rand$, desc: *random }
            - { pkg: math/rand/v2$, desc: *random }
            - { pkg: crypto/rand$, desc: *random }
            - { pkg: log$, desc: *logs }
            - { pkg: log/slog$, desc: *logs }
        # GOARCH-42: the technology never depends on the product.
        GOARCH-42:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/mlophez/polix-ai/internal/app
              desc: "GOARCH-42: internal/platform/ never imports internal/app/; pass the library the values it needs"
        # GOARCH-43: the support of the tests stays in the tests.
        GOARCH-43:
          files: ["$all", "!$test"]
          deny:
            - pkg: github.com/mlophez/polix-ai/internal/platform/testenv$
              desc: "GOARCH-43: internal/platform/testenv is support for the tests; import it only from _test.go files"
    nolintlint:
      require-specific: true
      require-explanation: true
    # GO-4: the limits of size and complexity of the code. gocyclo and gocognit report a function strictly above
    # min-complexity: a cyclomatic complexity above 15, a cognitive complexity above 20. Code past them splits into
    # unexported functions or sibling files, never a //nolint.
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    revive:
      # The default rules of revive stay on; setting a rule would otherwise turn them off.
      enable-default-rules: true
      rules:
        # GO-4: a Go file has at most 400 lines, every physical line counted; past that, part of it moves to a
        # sibling file.
        - name: file-length-limit
          arguments:
            - max: 400
  exclusions:
    # The usual unchecked errors: Close of a deferred cleanup, os.Remove of a temporary file, fmt.Print...
    presets: [std-error-handling]
    rules:
      # GO-4: the limits of size and complexity leave the tests out, the only exception of GO-3. A table of cases or
      # a test that walks a scenario reads better whole than split.
      - path: _test\.go$
        linters: [gocyclo, gocognit]
      - path: _test\.go$
        linters: [revive]
        text: file-length-limit
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      # The imports of the module go in their own group, after the standard library and the third parties.
      local-prefixes: [github.com/mlophez/polix-ai]
issues:
  # Report every finding, not only the first ones of each kind, so one run shows all there is to fix.
  max-issues-per-linter: 0
  max-same-issues: 0
