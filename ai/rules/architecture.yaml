# Architecture rules of the Go code of polix, described in docs/architecture.md. The depth of a folder gives the
# kind of its code: internal/app/<noun>/ is a domain, internal/app/<noun>/<verb>/ one of its use cases,
# internal/app/<noun>/<verb>/<helper>/ a part of that use case, and internal/platform/<lib>/ a library without
# domain; the width of a folder is the growth of the system. A deterministic rule is decided by its test in
# tests/architecture/goarchNN_test.go (TestGOARCH<N>), on the Go AST of internal/ and cmd/, or, for a fixed list of
# imports, by the list of depguard in .golangci.yml named after the rule, which its test runs; the part of a rule
# that no test can decide is a separate rule left to the review. The tests type check the module tolerantly: a
# name whose type they cannot resolve is accepted, so a rule on types is only as strong as what compiles.
rules:
  - id: GOARCH-1
    description: >-
      The depth of a folder gives the kind of its code, and growth is new sibling folders, never deeper ones.
      internal/ holds app/ and platform/. internal/app/ holds domain folders. A domain folder
      internal/app/<noun>/ holds <noun>.go, <noun>_*.go, their tests and use case folders. A use case folder
      internal/app/<noun>/<verb>/ holds in.go, logic.go, out.go, their siblings in_<topic>.go, logic_<topic>.go
      and out_<topic>.go (GOARCH-3), its document <verb>.md, their tests and helper folders. A helper folder
      internal/app/<noun>/<verb>/<helper>/ holds <helper>.go, <helper>_*.go and their tests, and no folder.
      internal/platform/ holds library folders, and a library folder
      internal/platform/<lib>/ holds Go files and their tests, and no folder. A folder named testdata is admitted
      at any level and left out. A file or a folder that fits none fails, and so does a Markdown file that is not
      the document of a use case (GOARCH-14). Every package clause equals the name of its folder.
    scope: ["internal/**"]
    deterministic: true
    check: tests/architecture/goarch01_test.go

  - id: GOARCH-2
    description: >-
      Each domain package has its entity file <noun>.go, which declares the entity <Noun>, a struct
      (internal/app/rule/rule.go declares Rule); the domain may be split into <noun>_*.go (rule_run.go). Use
      cases, helpers and libraries have no entity.
    scope: ["internal/app/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch02_test.go

  - id: GOARCH-3
    description: >-
      A use case is three files in its folder, as a pure core and an imperative shell: in.go (the entry, a cobra
      command or the loader of a load use case (GOARCH-11), the shell and the port it needs from the outside),
      logic.go (the pure logic) and out.go (the
      adapter that implements the port). Each may grow into siblings of its kind, in_<topic>.go, logic_<topic>.go
      and out_<topic>.go, with their tests: the in files, the logic files and the out files. A sibling never
      stands for its main file, and is checked by the rules of its kind as its main file is: the in files by
      GOARCH-12, 15, 20, 22, 32 and 37, the logic files by GOARCH-4, 23 and 41, the out files by GOARCH-5 and 24.
      Command, Request, Response and Port stay in in.go, Decide and Output in logic.go and Adapter in out.go
      (GOARCH-11); a sibling exports no name, but the methods of Adapter may be declared in any out file.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch03_test.go

  - id: GOARCH-4
    description: >-
      The domain and the logic of a use case are pure, and what they import is GOARCH-41. They never read the
      clock (time.Now, Since, Until, Sleep, After, Tick, NewTimer, NewTicker, AfterFunc), write to the console
      (fmt.Print*, print, println), start goroutines nor panic, and hold no state: a variable of the package is a
      table, built once in its declaration from literals, regexp.MustCompile or other tables, and never assigned,
      indexed-assigned nor appended to afterwards; a blank one; or a sentinel error (Err* or err* = errors.New or
      fmt.Errorf). The logic uses no name declared in in.go nor out.go: never the port, the request nor the
      adapter of its use case. A helper of its use case that the logic imports is as pure as the logic: its files
      pass the same checks and import only what the list GOARCH-41-logic of depguard in .golangci.yml allows,
      which the test reads.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch04_test.go

  - id: GOARCH-5
    description: >-
      The adapter implements the port of its own use case: Adapter of out.go has every method of Port of in.go,
      declared or promoted from an embedded field. The compiler checks it too, where the entry passes the adapter
      as the port.
    scope: ["internal/app/*/*/in.go", "internal/app/*/*/out.go", "internal/app/*/*/out_*.go"]
    deterministic: true
    check: tests/architecture/goarch05_test.go

  - id: GOARCH-6
    description: >-
      cmd/ only wires the root command and the entries of each use case: its files declare nothing but func main,
      and it has no tests (the commands are tested through their entries in internal/app/, and the end-to-end
      tests that compose several live in tests/). main builds the loader of each load use case once, calling its
      Command once (ruleload.Command()), and passes it to the Command of every use case that reads its file.
    scope: ["cmd/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch06_test.go

  - id: GOARCH-7
    description: >-
      The packages of internal/ have no import cycles. That internal/platform/ never imports internal/app/ is
      GOARCH-42.
    scope: ["internal/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch07_test.go

  - id: GOARCH-8
    description: >-
      The domain is shared by the whole app: a use case folder of any noun may import the domain folder of any
      other noun. A permission: what it leaves out is decided by GOARCH-9.
    scope: ["internal/app/**/*.go"]
    deterministic: false

  - id: GOARCH-9
    description: >-
      The direction of every import follows from the depth. A use case imports the domains of any noun (up and
      across) and its own helpers (the only way down), and never another use case, of its noun or of another. A
      domain imports only other domains of internal/app/, never a use case nor a helper. A helper is imported only
      by the files of its use case package, tests included: no other helper, use case, domain nor cmd/ imports
      it. Only cmd/ and tests/ import a use case, but the _test.go files of a use case may import load use cases
      (internal/app/<noun>/load, GOARCH-11), and only them, to build their loaders as main does, so the tests that
      run a command on real files read them as polix does. The test files count as their package otherwise. That
      internal/platform/ never imports internal/app/ is GOARCH-42.
    scope: ["internal/app/**/*.go", "cmd/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch09_test.go

  - id: GOARCH-10
    description: >-
      Use cases are vertical, and what they share goes where the depth says: logic shared by several use cases,
      of one noun or of several, goes in the domain; a part of one use case that grows goes in a helper folder of
      that use case, never in another use case nor in a domain it alone uses.
    scope: ["internal/app/**/*.go"]
    deterministic: false

  - id: GOARCH-11
    description: >-
      The names of a use case are fixed, the same in every use case package: logic.go declares the logic Decide
      and its Output; in.go declares the entry Command, Request, Response and Port; out.go declares Adapter.
      Outside its package a use case reads with the alias <noun><verb> that importas enforces (rulecheck.Command
      for internal/app/rule/check). A load use case, internal/app/<noun>/load, loads a file that several use cases
      read: its domain declares its loader Load, a named function type, and the result of the loader Loaded, a
      struct (rule.Load and rule.Loaded), and its Command returns that loader instead of a cobra command
      (GOARCH-15).
    scope: ["internal/app/*/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch11_test.go

  - id: GOARCH-12
    description: >-
      A port is one interface, never a struct, declared where it is used: in.go declares the interface Port.
      Besides it, the in files (in.go and its siblings) declare at most one interface, unexported and named: the
      transport formats the entry reads (format, with one unexported type of the in files per format that
      implements it). No other interface, named or anonymous.
    scope: ["internal/app/*/*/in.go", "internal/app/*/*/in_*.go"]
    deterministic: true
    check: tests/architecture/goarch12_test.go

  - id: GOARCH-13
    description: >-
      In every file the types (interfaces and structs) come first, right after the imports, before constants,
      variables and functions; methods go after all the types.
    scope: ["internal/**/*.go", "cmd/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch13_test.go

  - id: GOARCH-14
    description: >-
      Each use case has its document <verb>.md in its folder (internal/app/rule/check/check.md), starting with
      # <Verb><Noun> built from its path (# CheckRule) and with the sections, each once and in this order:
      Trigger, Request, Logic, Response, Port, Errors and Flow. A heading inside a fenced code block is not a
      section. The Trigger of a load use case, whose entry is no command, names main of cmd/, which builds its
      loader, and the use cases it passes the loader to.
    scope: ["internal/app/**"]
    deterministic: true
    check: tests/architecture/goarch14_test.go

  - id: GOARCH-15
    description: >-
      The entry of a use case is the only exported function of its in files, named Command and declared in in.go;
      the shell and the other helpers of the in files are unexported, and a sibling in_<topic>.go exports no name.
      Command returns a *cobra.Command, but the Command of a load use case (GOARCH-11), which returns the loader of
      its domain (<noun>.Load); any other result is a fault.
    scope: ["internal/app/*/*/in.go", "internal/app/*/*/in_*.go"]
    deterministic: true
    check: tests/architecture/goarch15_test.go

  - id: GOARCH-16
    description: >-
      Every use case declares Request and Response in in.go (GOARCH-11), and neither the types of its logic nor
      the exported types of the domain carry field tags, the shape of a transport, on named or embedded fields. An
      unexported type that decodes a format, such as the decoding types of the out files of a load use case
      (workflowYAML of internal/app/workflow/load), may.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch16_test.go

  - id: GOARCH-17
    description: >-
      Each folder is named after what it holds: a domain after its entity, a noun; a use case after what it does
      to that noun, a verb, so the use case reads <Verb><Noun>; a helper after its role in its use case; a library
      after its technology. A command without an obvious noun gets one from what it acts on (setup for check,
      install and doctor; workflow for graph and log).
    scope: ["internal/**/*.go"]
    deterministic: false

  - id: GOARCH-18
    description: >-
      The domain and the logic are pure beyond the imports GOARCH-41 lists: they take data and return data, and
      never touch disk, git, network, processes, clock nor environment, not even through a library. Concurrency
      and deadlines live in the adapter: the shell runs the steps of the output in sequence.
    scope: ["internal/app/**/*.go"]
    deterministic: false

  - id: GOARCH-19
    description: >-
      internal/platform/ holds the technology polix runs on, without domain: a technology shared by several use
      cases lives there as a library that the adapters wrap, instead of each adapter repeating it, and so does the
      support the tests share (testenv).
    scope: ["internal/**/*.go"]
    deterministic: false

  - id: GOARCH-20
    description: >-
      in.go of a use case is its imperative shell, always with the same shape: it reads through the port what the
      logic needs, branching on the request to know what to read; calls the logic from one call site (once, or in
      a loop in the step shape); carries out its output through the port, step by step; and builds the response.
      What the result of a step means (go on, stop, failed) is asked to the domain (rule.Result.Tail,
      rule.Results.Failed), never computed in the shell: the shell only sequences, so it can be tested with a fake
      of the port. When what the logic decides depends on the result of an earlier step (the step shape), the logic
      returns the next step instead of the whole output: the shell carries it out through the port and calls the
      logic again with its result, from one call site in a loop, until the logic answers with no step; only such
      use cases take this shape. Its signature and its calls are GOARCH-32; what its conditions may mention is
      GOARCH-37.
    scope: ["internal/app/*/*/in.go", "internal/app/*/*/in_*.go"]
    deterministic: false

  - id: GOARCH-21
    description: >-
      The document of a use case says what its code does, and a change of the behavior of the use case updates
      its document in the same commit. That it names the fields and the methods of the code is GOARCH-36.
    scope: ["internal/app/**"]
    deterministic: false

  - id: GOARCH-22
    description: >-
      The entry turns the flags, or the stdin of a hook, into the Request and validates them before the shell
      runs (a flag that needs another, allowed values); the shell turns the Request into the Response, built from
      the Output and what the port returned while carrying it out; and the entry serializes the Response to the
      console and sets the exit code. Only the Request and the Response carry the shape of the transport.
    scope: ["internal/app/*/*/in.go", "internal/app/*/*/in_*.go", "internal/app/*/*/logic.go", "internal/app/*/*/logic_*.go"]
    deterministic: false

  - id: GOARCH-23
    description: >-
      Every use case has the same shape: the logic is one function, Decide, that takes domain values (types of the
      domain of any noun, or predeclared types) and returns its decision, Output, and nothing else: a refusal is
      data of the output, never an error. logic.go exports only those two names, its siblings logic_<topic>.go
      export none, and the in files use only them of the logic files. The names reserved to the use cases
      (Command, Request, Response, Port, Adapter, Decide, Output, and any *Output, *Request, *Response, *Port or
      *Adapter) are never declared by a domain nor a helper, and are never a domain type, whatever their package.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch23_test.go

  - id: GOARCH-24
    description: >-
      The out files, out.go and its siblings out_<topic>.go, hold only the adapter of their use case, an object
      that implements the port: the public struct Adapter, declared in out.go, its methods, in any out file,
      unexported constants, and unexported types that decode or encode a format the adapter reads or writes
      (fileYAML), with their methods; no other type, no function (no constructor: the entry fills the fields of
      the adapter and passes it as the port) and no variable. The exported methods of the adapter are the methods
      of the port and no other; what they need goes in unexported methods of the adapter, in a decoding type, in a
      helper of the use case, or in internal/platform/ when it is shared (GOARCH-19). That an unexported type of
      the out files decodes or encodes a format is left to the review.
    scope: ["internal/app/*/*/out.go", "internal/app/*/*/out_*.go"]
    deterministic: true
    check: tests/architecture/goarch24_test.go

  - id: GOARCH-25
    description: >-
      An exported struct of internal/app/ has only exported fields: the structs that go from one part to another
      (domain, Request, Response, Output, Adapter) are open to read. A struct that is a detail of one file, such
      as the shape of a yaml it decodes, stays unexported.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch25_test.go

  - id: GOARCH-26
    description: >-
      Every exported struct of the domain has the method Valid() error, with a value receiver, which tells why a
      value is not valid. Go declares it in the package of the struct, so in its domain package.
    scope: ["internal/app/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch26_test.go

  - id: GOARCH-27
    description: >-
      The domain is immutable: the methods of a domain struct have a value receiver, so a method that changes the
      value returns a copy. They are named after what the use cases do with the value, never setters nor getters:
      no Set* nor Get*, no method that only returns a field or a field of a field (the fields are public), no
      method that only copies its parameters into fields.
    scope: ["internal/app/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch27_test.go

  - id: GOARCH-28
    description: >-
      A domain struct changes only through its own methods: no code of internal/app/ outside the methods of T
      assigns to a field of a T (x.F = v, x.F += v, x.F++, x.F[i] = v), reached directly or promoted through
      embedding, not even the methods of another domain struct that holds a T. Its fields are set only in the
      literal that builds it. The tests are left out.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch28_test.go

  - id: GOARCH-29
    description: >-
      A value of a domain struct is built with a literal, never with a constructor (no function New* nor new* in
      internal/app/), and validated: a literal with fields (T{...} or &T{...}), in a function or at the top level
      of a file, is bound to a variable on which the same function calls Valid() afterwards and uses its error,
      neither alone as a statement, deferred, in a goroutine nor assigned to _. The empty literal T{}, the zero
      value returned with an error, and the tests are left out.
    scope: ["internal/app/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch29_test.go

  - id: GOARCH-30
    description: >-
      Beyond what GOARCH-26 to GOARCH-29 check: Valid covers every invariant of the value and its result is
      handled before the value is used; a method that changes a slice or a map of the value copies it first, so
      the copy it returns shares nothing the original can see; and each method is named after an intent of the
      use cases (Retire, Narrow), not after the field it touches.
    scope: ["internal/app/*/*.go"]
    deterministic: false

  - id: GOARCH-32
    description: >-
      in.go declares the shell run, of type func(context.Context, Port, Request) (Response, error). Outside the
      tests, the shell is the only function or method of its use case package that calls the logic Decide, from
      one call site, in a function declaration or in the value of a package variable. The methods of the port and
      of the adapter, declared or promoted, are called only from the functions and methods of the in files (in.go
      and its siblings) other than the entry Command, such as the shell and the unexported functions that carry
      out its steps, and from the methods of the adapter itself, which never call the logic.
    scope: ["internal/app/*/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch32_test.go

  - id: GOARCH-33
    description: >-
      The port speaks in domain values: every method of Port takes context.Context first, and the rest of its
      parameters and its results are domain types of any noun or predeclared types (error among them), so the
      types of the infrastructure, of a library or of another use case never leave the adapter. A port embeds no
      interface: it lists its own methods.
    scope: ["internal/app/*/*/in.go"]
    deterministic: true
    check: tests/architecture/goarch33_test.go

  - id: GOARCH-34
    description: >-
      Every use case has its two tests: logic_test.go calls the logic Decide, does not mention Port nor Adapter
      and uses no name declared in in_test.go, where the fake of the port lives; in_test.go calls the shell run
      and does not mention Adapter. Port and Adapter count only as unqualified identifiers, so a field such as
      x.Port is no match. It may have out_test.go, which tests the adapter against a temporary repository. That
      the logic is tested with domain values, without fakes, and the shell with a fake of the port is left to the
      review (GOARCH-20).
    scope: ["internal/app/*/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch34_test.go

  - id: GOARCH-35
    description: >-
      Each test file is named after the file it tests: <stem>_test.go sits next to <stem>.go, so the test of a
      file is found by its name.
    scope: ["internal/**/*_test.go"]
    deterministic: true
    check: tests/architecture/goarch35_test.go

  - id: GOARCH-36
    description: >-
      The document of a use case names, between backquotes, every field of Request in ## Request, every field of
      Response and of the structs of in.go it holds in ## Response, and every method of Port in ## Port, so a
      field or a method added to the code without its documentation fails. A heading inside a fenced code block
      is not a section.
    scope: ["internal/app/*/*/*.md", "internal/app/*/*/in.go"]
    deterministic: true
    check: tests/architecture/goarch36_test.go

  - id: GOARCH-37
    description: >-
      The shell decides nothing: every condition of an if, for or switch in the shell run and in the unexported
      functions of the in files (in.go and its in_<topic>.go siblings) is made of fields of the request, errors
      (err != nil, errors.Is, errors.As), fields or methods of values of the domain or of the output, and len of
      them, compared only with nil or a zero literal ("", 0, false) and combined with !, && and ||: no other
      literal, no arithmetic, no ordering (<, >) and no other call. The entry Command and the methods of the files
      are left out.
    scope: ["internal/app/*/*/in.go", "internal/app/*/*/in_*.go"]
    deterministic: true
    check: tests/architecture/goarch37_test.go

  - id: GOARCH-38
    description: >-
      The tests are white box: every *_test.go of internal/ declares the package of its folder, never
      <name>_test, so the tests reach the shell, the fakes and the unexported names without exporting anything.
    scope: ["internal/**/*_test.go"]
    deterministic: true
    check: tests/architecture/goarch38_test.go

  - id: GOARCH-39
    description: >-
      No dot import (import . "pkg") in internal/ nor cmd/: every name of another package is written with its
      qualifier, so the file says which package each name comes from.
    scope: ["internal/**/*.go", "cmd/**/*.go"]
    deterministic: true
    check: tests/architecture/goarch39_test.go

  - id: GOARCH-41
    description: >-
      The domain files (internal/app/<noun>/*.go) and the logic files of every use case
      (internal/app/<noun>/<verb>/logic.go and its siblings logic_<topic>.go) import only the standard library
      but what touches the outside (os, os/exec, os/signal, net, net/http, io/fs, runtime, syscall), the
      randomness (math/rand, math/rand/v2, crypto/rand), the logs (log, log/slog) and the formats (encoding/json,
      encoding/xml); internal/app/ (GOARCH-9
      decides which of its packages); the pure libraries glob, semver, shell, text and yamlfmt of
      internal/platform/; and templates. They know no format: never encoding/json, encoding/xml nor a yaml
      library, whose translation belongs to the in and out files of a use case (GOARCH-44). The logic never
      imports context either. An allowlist: a
      new library of internal/platform/ is forbidden to them until it is added on purpose. The lists
      GOARCH-41-domain and GOARCH-41-logic of depguard in .golangci.yml hold it, and the test files are left out.
    scope: ["internal/app/*/*.go", "internal/app/*/*/logic.go", "internal/app/*/*/logic_*.go", ".golangci.yml"]
    deterministic: true
    check: tests/architecture/goarch41_test.go

  - id: GOARCH-42
    description: >-
      internal/platform/ never imports internal/app/: the technology never depends on the product, so a library
      takes the values it needs as parameters. The list GOARCH-42 of depguard in .golangci.yml holds it, tests
      included.
    scope: ["internal/platform/**/*.go", ".golangci.yml"]
    deterministic: true
    check: tests/architecture/goarch42_test.go

  - id: GOARCH-43
    description: >-
      internal/platform/testenv, the support that the tests share, is imported only by _test.go files. The list
      GOARCH-43 of depguard in .golangci.yml holds it.
    scope: ["*.go", ".golangci.yml"]
    deterministic: true
    check: tests/architecture/goarch43_test.go

  - id: GOARCH-44
    description: >-
      A domain package (internal/app/<noun>/*.go, tests aside) declares only types, interfaces, constants,
      variables that are not functions, and methods of its types, structs or named types (workflow.Cond). It
      declares no function that is not a method, no init, and no package variable whose value is a function (a
      function literal, a function or a variable of a function type). Each function that is not a method goes
      where it belongs: the translation of a format (decoding YAML or JSON, parsing the input of an agent) goes to
      the in or out files of the use case that reads or writes it, or to a load use case when several use cases
      read the file (GOARCH-11); logic that several use cases share, or that a shell asks (GOARCH-20, GOARCH-37),
      becomes a method of the domain type it works on; logic of only one use case goes to its logic.go or a
      logic_<topic>.go. The domain keeps the validation of its values (Valid, Workflow.Problems), never the
      decoding of a format.
    scope: ["internal/app/*/*.go"]
    deterministic: true
    check: tests/architecture/goarch44_test.go

  - id: GOARCH-45
    description: >-
      The logic Decide of a use case takes at most 4 parameters, each name counted (a, b string are two). What
      does not fit is grouped into a value of the domain, built and validated by the shell (GOARCH-29) and named
      after what it is (version.Update, rule.Selection), never a bag of the parameters of one function; several
      flags become one such value, or the method of a domain value that tells them apart.
    scope: ["internal/app/*/*/logic.go"]
    deterministic: true
    check: tests/architecture/goarch45_test.go
