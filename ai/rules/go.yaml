rules:
  - id: GO-2
    description: >-
      Code, comments, docs and commit messages are written in English; only the texts that polix.yaml shows to
      the agent or the user may be in Spanish.
    scope: ["*.go", "docs/**", "examples/**", "scripts/**", "install.sh", "install.ps1"]
    deterministic: false

  - id: GO-3
    description: >-
      A finding of the linter that is intended is silenced on its own line with `//nolint:<linter> // <reason>`,
      never by disabling the linter or excluding the file in .golangci.yml.
    scope: ["*.go", ".golangci.yml"]
    deterministic: false
