rules:
  - id: GO-2
    kind: convention
    subject: language of the texts
    description: >-
      Code, comments, docs and commit messages are written in English; only the texts that polix.yaml shows to
      the agent or the user may be in Spanish.
    scope: ["**"]
    deterministic: false

  - id: GO-3
    kind: convention
    subject: linter exclusions
    description: >-
      A finding of the linter that is intended is silenced on its own line with `//nolint:<linter> // <reason>`,
      never by disabling the linter or excluding the file in .golangci.yml. The only exception is the exclusion of
      the _test.go files from the limits of size and complexity of GO-4 and GO-5 (gocyclo, gocognit and the rule
      file-length-limit of revive), in linters.exclusions.rules of .golangci.yml.
    scope: ["*.go", ".golangci.yml"]
    deterministic: false

  - id: GO-4
    kind: metric
    subject: function
    description: >-
      A function that is not in a _test.go file has a cyclomatic complexity of at most 15 and a cognitive
      complexity of at most 20. Past that, the code splits into unexported functions or methods named after their
      steps, never a //nolint nor an exclusion. gocyclo and gocognit decide it, enabled in .golangci.yml; the tests
      are left out (GO-3).
    scope: ["*.go", ".golangci.yml"]
    deterministic: true
    check: tests/architecture/go04_test.go

  - id: GO-5
    kind: metric
    subject: Go file
    description: >-
      A Go file that is not a _test.go has at most 400 lines, every physical line counted. Past that, the code
      splits into sibling files along GOARCH-1, never a //nolint nor an exclusion. The rule file-length-limit of
      revive decides it, enabled in .golangci.yml; the tests are left out (GO-3).
    scope: ["*.go", ".golangci.yml"]
    deterministic: true
    check: tests/architecture/go04_test.go
