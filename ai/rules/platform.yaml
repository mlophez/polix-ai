rules:
  - id: XPLAT-1
    kind: convention
    subject: path
    description: >-
      Paths go through filepath and are shown with forward slashes.
      Never build a path by joining strings with / or \; use filepath.Join and filepath.ToSlash.
    scope: ["*.go", "install.sh", "install.ps1", "scripts/**", ".github/**"]
    deterministic: false

  - id: XPLAT-2
    kind: convention
    subject: hook commands
    description: >-
      Hook commands of the examples are plain `polix ...` calls joined with `;` at most: Claude Code runs them
      with sh, Git Bash or PowerShell, so `||`, `command -v` or `{ ...; }` are not allowed.
    scope: ["examples/**", ".claude/settings.json"]
    deterministic: false

  - id: XPLAT-3
    kind: testing
    subject: OS specific code
    description: >-
      OS specific behaviour is guarded by runtime.GOOS or build tags and covered by a test that runs in the CI
      matrix of Linux, macOS and Windows.
    scope: ["*.go", "install.sh", "install.ps1", "scripts/**", ".github/**"]
    deterministic: false
