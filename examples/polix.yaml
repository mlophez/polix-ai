# Example polix.yaml: a complete team workflow (ticket, plan, builder, tests, reviewer, commit) plus the
# rules of rules.path (ai/rules/) injected and checked, annotated as a reference of every option of the schema and
# of every form each option takes. Validate it with `polix config check`; draw it with `polix graph`, which names the
# shortcut of each entry. Design and limits: docs/polix.md; every key, condition and verb one by one:
# docs/reference.md; recipes, one per use case: docs/use-cases.md.
#
# Two layers: `guardrails` holds the basics every project wants from the first minute (files and commands no agent
# touches, branches nobody commits on, a formatter per edited file, the checks before the end of the turn), each a
# short list; `on` holds the flow of the team (tickets, plans, builders, reviewer subagents) and whatever a shortcut
# does not cover.
#
# How a hook call is answered:
# 1. The adapter turns the hook input into neutral events (an edit of several files gives one event per path; a
#    command line with a `git commit` gives pre_command and then pre_commit).
# 2. The built-in protection runs first, even without this file: nobody edits the state (<git-dir>/polix/), and no
#    command naming it may write files. polix protects nothing else on its own: AGENTS.md, CLAUDE.md, ai/rules/ and
#    polix.yaml are only protected when this file says so.
# 3. With a valid file, the protections of `guardrails` run next: `protected_files` and `forbidden_commands`. No
#    actor gets past them, the main session included, and they also cover files git ignores (.env); an edit outside
#    the repository skips them.
# 4. Edits outside the repository and edits of files git ignores skip the entries of `on`: they govern the change,
#    what a commit may hold, so a build output, a local .env or a scratch file never fires a ticket, plan, format or
#    docs entry. A commit in another repository (git -C ../other commit) skips the entries of pre_commit too.
# 5. The entries of the event run in order, first those the other shortcuts of `guardrails` expand into, then those
#    written in `on`; each one whose `when` holds and whose `unless` does not hold carries out its action. The first
#    one that actually blocks ends the evaluation (see `on` below).
#
# An invalid file (any problem `polix config check` reports) blocks pre_edit, pre_command and pre_commit with the
# problems (fail closed), except the main session editing polix.yaml or running `polix config check`,
# `polix config fmt --check`, `polix update`, `polix doctor` or `polix version`, and only warns on the other events,
# so a broken file never traps a stop in a loop. A file that `requires` a newer polix blocks the same way, asking to
# run `polix update`, and not even the main session may edit it.
#
# Cheat sheet (each one is explained where it is first used below):
# - Shortcuts of guardrails, each in its one form: protected_files and protected_branches take a list of strings;
#   forbidden_commands, format_on_edit and run_on_stop a list of maps.
# - Events, in lifecycle order: start, prompt, subagent_start, pre_edit, post_edit, pre_command, post_command,
#   pre_commit, subagent_stop, stop.
# - Verbs, exactly one per action, only where Claude Code and Codex both support them:
#   - block: on prompt, pre_edit, pre_command, pre_commit, subagent_stop and stop (rejected on start,
#     subagent_start, post_edit and post_command, which already happened);
#   - inject: on every event but subagent_stop and stop (an agent that stops cannot receive context);
#   - run: on every event; it blocks where block is valid, and elsewhere a failure reaches the AI as context;
#   - notify: on every event; a message for the user, never for the AI.
# - Conditions that hold only on some events (`polix config check` rejects them elsewhere):
#   - path: pre_edit, post_edit;
#   - command, writes: pre_command, post_command, pre_commit;
#   - exit: post_command.
#   Every other condition (actor, finished, agents_are_running, branch, var, changed, file, contains, changed_lines,
#   changed_files, risk_score, not, any) holds on any event.

# Required. The only version is 1.
version: 1

# Optional. The oldest polix that knows every option this file uses; set it when an option needs a newer polix
# than the one the team may have. It is read before the rest of the file, so an older polix that does not know the
# other options blocks edits and commands asking to run `polix update`, instead of reporting them as mistakes, and
# the session start hook looks for the new release at once. A development build ignores it. `polix config check`
# rejects a value that is not a version like 0.2.0. Known since polix 0.1.0: no earlier polix exists. This file needs
# 0.3.0: `guardrails.run_on_stop`, `base_branch`, `max_stop_retries`, `subagent_start` and `notify` are unknown to
# an older polix.
requires: 0.3.0

# Optional, default main. The branch the change merges into, or a list of candidates, used only by
# `polix rules check --changed` (CI): each candidate is tried locally and then as origin/<branch>, and the one whose
# merge base is closest to HEAD wins. The command fails when none exists, and `polix config check` and
# `polix doctor` warn about it. In the hooks, `changed` always compares with HEAD: the change is reviewed commit
# by commit.
# In GitHub Actions, pass `--base="${{ github.base_ref }}"` with a checkout of `fetch-depth: 0`; outside a pull
# request it is empty, and an empty --base falls back to this list. On a push to a branch of this list, such as
# main, --changed checks nothing (the branch is its own base): run `polix rules check` without it there.
# Forms: a single branch, `base_branch: main`, or a list:
base_branch: [main, dev]

# Optional, default 3 (0 also means 3; negative is rejected). Loop guard of every block of stop and
# subagent_stop (a block or a failing run): after this many blocks of the same entry, in the same session, by the
# same actor and on the same content hash, the agent may stop, and the log records a `loop_guard` decision. A block
# let through by the guard does not end the evaluation, and a subagent let through does not count as `finished`.
max_stop_retries: 3

# Optional. Variables extracted from the current branch name, usable as {name} in any string and by the condition
# `var`.
# - `branch` is a regular expression (Go RE2 syntax): the value is its first group, or the whole match without
#   groups.
# - When it does not match, the variable has no value: the `var` condition fails and {name} is left as is.
# - A variable cannot be called path, command, branch, changed_lines, changed_files or risk_score, the built-in
#   placeholders, and its only key is `branch`.
vars:
  key: { branch: "^([A-Z][A-Z0-9]+-[0-9]+)" } # first group: PLAT-123-add-retry -> PLAT-123
  release: { branch: "^release/[0-9.]+$" }    # no group, the whole match: release/2.4 -> release/2.4

# Optional. The rules on how to write the code, which polix injects and checks.
# - `path`, default ai/rules: the folder of the rules, relative to the root (no absolute path, no `..` out of the
#   root, no glob). polix reads its *.yaml but retired.yaml, not its subfolders.
# - `run`: how a check of a rule runs. It maps a glob, matched against the `check` of a rule as the globs of a
#   scope are (without `/` against its base name, with `/` against its path), to the argv that runs it from the
#   root, without a shell; the first glob that matches wins, in this order, so a specific folder goes before a
#   generic glob. There are no default runners.
# Singular placeholders, one value per check: {file} (the check, relative to the root, with /), {dir} (its folder
# as ./<folder>, ./ at the root), {id} (the id of the rule, GOARCH-4) and {name} (the id with only its letters and
# digits, GOARCH4).
# Plural placeholders, for the whole group: {names} (the names joined with |, a regex alternation), {files} and
# {dirs} (one argument per distinct file or folder; each must be a whole argument).
# The checks whose argv, with the singular placeholders expanded, is the same share one invocation: the runner of
# tests/architecture/ below runs once for that folder, `go test ./tests/architecture -run ^Test(GOARCH1|GOARCH2)$`.
# When a shared invocation fails, each rule of it runs again alone to tell which ones fail.
# A check no glob matches runs as a program (its shebang; on Windows a .sh with the bash of Git for Windows and a
# .py with py -3, python3 or python). Used by `polix rules check` and by `run: { rules }`; `polix config check`
# reports an empty argv, an empty glob, an unknown placeholder or {files} or {dirs} inside a longer argument.
rules:
  path: ai/rules
  run:
    "tests/architecture/*_test.go": [go, test, "{dir}", -run, "^Test({names})$"] # one go test per folder
    "*_test.go": [go, test, "{dir}", -run, "^Test{name}$"]                       # one go test per rule
    "*.py": [uv, run, python, "{file}"]                                          # one run per check
    "*.sh": [bash, "{files}"]                                                    # hypothetical: one bash for all

# Optional. The folders of the plans (written by the skill plan) and of the reports (audits, reviews), relative to
# the root, with the same limits as rules.path. polix does not read them: it tells the agent where they are
# (guidance.layout), and the skills write there.
plans:
  path: ai/plans
reports:
  path: ai/reports

# Optional, every switch true by default. Built-in instructions polix injects into the agent on every start
# (startup, resume, clear, compaction), in English, as one context before those of the start entries. Its text is
# the template templates/session_start.md.tmpl of the binary. They ask for cooperation and block nothing. Injected
# only with a valid polix.yaml; a switch left out is on, false turns it off, and an unknown key is rejected.
# - commit: run each commit as a git commit command of its own, not chained with &&, ; or | nor wrapped in sh -c,
#   so pre_commit sees it.
# - edit: create and change files with the edit tool of the agent, not from the shell (sed -i, redirections, tee,
#   heredocs), so pre_edit, post_edit and the rules they inject see the change.
# - layout: the folders of rules.path, plans.path and reports.path, so the agent and the skills use them.
guidance:
  commit: true
  edit: true
  layout: true

# Optional. The options of the risk score of the condition risk_score.
# - `weights`: an ordered map of path glob to a non-negative number, the weight of the matching files. The first
#   glob that matches a file, in this order, gives its weight; a file no glob matches weighs 1. So list the tests
#   of a critical folder before the folder, to make them weigh less. A weight of 0 leaves a path out of the score.
# The risk score of a set of files is the sum of weight times log2(1 + added + deleted lines) of each, rounded.
# `polix config check` reports an empty glob or a negative weight; a weight that is not a number, a `risk` or
# `weights` that is not a map, and a key of `risk` other than `weights` stop the parse. Calibrate with `polix risk`,
# on the current change or on a past commit: `polix risk --commit <rev> --changed 'src/**'`.
risk:
  weights:
    "*_test.go": 0.5
    "src/core/**": 3
    "src/auth/**": 4
    "docs/**": 0.2
    "*.lock": 0

# Optional. The programs the repository needs on the PATH: a list of names, nothing else (no version, no reason).
# polix checks only these, plus git, which it adds at the end when the list does not name it (a missing git is the
# fail of the area git of polix doctor), never the commands of the workflow, and it never blocks because of them:
# - On the first prompt of a session, before the entries, the hook looks them up and, when some are missing, tells
#   the AI, in English, which ones, asking it to install them, or to ask the user to, before anything else. It is a
#   once-only context: due again after a start of the session (startup, resume, clear, compaction) or when the set
#   of missing programs changes, never on start itself, and a refused prompt does not count it as told.
# - `polix doctor` warns once per missing program in the area `requirements`, or gives one OK line when the PATH runs
#   them all; it never fails because of them, and `polix doctor --hook` at session start lists the missing ones.
# A program is looked up as the command of a `run` is: on the PATH the hooks give polix, not that of an interactive
# shell. On Windows the lookup tries the extensions of PATHEXT, so write the names without extension (`golangci-lint`,
# never `golangci-lint.exe`, which is missing on macOS and Linux). A shell alias or function, a script without
# extension that only Git Bash runs, and a program found only in the current folder count as missing.
# `polix config check` reports a single name, a map or an item that is not a name, showing the form, and an empty
# name; `polix config fmt` puts the key right before guardrails. A polix older than the key reports it as unknown, so
# set `requires` to a release that knows it.
requirements: [go, golangci-lint]

# Optional. The guardrails every project wants from the first minute, each a short list in exactly one form. Two
# of them are protections of the engine: protected_files and forbidden_commands apply before every entry of `on`, to
# every actor, without exceptions, also to the files git ignores, and only with a valid file. The other three are
# shortcuts: polix expands each one into ordinary entries of `on` when it reads the file, so they act, log and show
# in `polix graph` (with the name of their shortcut) as any entry; when one falls short, write its entries in `on`
# and tune them. The flow of the team (tickets, plans, builders, reviewer subagents) and any other condition or verb
# go to `on`.
# In each event, the entries of protected_branches, format_on_edit and run_on_stop come before those written in
# `on`, each group in file order, but for the notice of run_on_stop, which comes last on stop. Each expanded entry takes the line of its item, so `polix config check`, the
# log and the repeat rules tell them apart.
# `polix config check` rejects a key of guardrails other than these five, an unknown key of an item, an empty glob,
# pattern, branch or command, and a shortcut written in another form than its own (a single string where a list
# goes, a string where a map goes), showing the expected form.
guardrails:
  # protected_files: paths no agent writes, the main session included: only a person changes them by hand. A list
  # of path globs. It denies an edit of a matching path (never one outside the repository) and a command that writes
  # one (the heuristic of `writes`, which also catches a folder or a wildcard holding it, `rm -rf ai` for
  # ai/rules/**), never a read; a commit is stopped the same way. It also covers files git ignores (.env). Its
  # messages, in English: "<path> is protected in polix.yaml: only a person changes it.", and for a folder or a
  # wildcard that holds a protected path "<folder> holds <glob>, protected in polix.yaml: only a person changes
  # it.". The log records the denial as `guardrails.protected_files`. A protected file a command changed anyway (a
  # Python script, `bash -c`) is put back after it ran, and the command is refused naming it (see "Files a command
  # changed" in docs/polix.md); this, like format_on_edit, pre_edit and post_edit, costs every command two content
  # hashes, and files git ignores are not put back.
  # Protecting polix.yaml or ai/rules/ keeps the skills `workflow` and `add-rule` from writing them. A glob without
  # `/` matches the name in any folder (`.env` keeps every .env); a leading `/` anchors it to the root, as in
  # .gitignore (`/AGENTS.md` is only the one of the root); `**` protects a whole folder. To keep only the subagents
  # away from a path, use `writes` and `path` with `actor` in `on` instead (see pre_command and pre_edit).
  protected_files:
    - .env       # every .env, in any folder
    - "*.pem"    # every certificate or key in PEM, in any folder
    - /AGENTS.md # only the one of the root
    - /CLAUDE.md
    # - /polix.yaml       # the workflow itself: then only a person changes it
    # - ai/rules/**       # the rules: then the skill add-rule cannot write them
  # forbidden_commands: commands no agent runs, the main session included, in any position of the line
  # (`cd tmp && rm -rf /` too). Each command is matched as written: a heuristic aimed at accidents, which misses
  # another spelling (`rm -fr /`, `git push -f`), a wrapper (`sudo rm -rf /`) and `bash -c '...'` or `$(...)`.
  # List the usual spellings, and start a pattern with `*` to cover a wrapper. A list of maps with:
  # - pattern: required, a command pattern, as the condition `command` takes it (see the command patterns below);
  # - reason: optional, the message of the denial, followed by the line.
  # The first item, in file order, whose pattern matches any command of the line denies it, on pre_command and
  # pre_commit; without a reason the message, in English, says the line is forbidden by polix.yaml and a person
  # must run it, followed by the line. The log records the denial as `guardrails.forbidden_commands`, with the line
  # of the item. It has no exceptions: to let someone through (an actor, a branch), write a block in `on` with an
  # `unless` instead (see pre_command).
  forbidden_commands:
    - pattern: "*rm -rf /*"
    - pattern: "*rm -fr /*"
    - pattern: "git reset --hard*"
    - pattern: "git clean -f*"
    - pattern: "terraform destroy*"
    - pattern: "kubectl delete*"
      reason: "Los recursos de Kubernetes se borran desde el pipeline: pídele al usuario que lo haga él."
  # protected_branches: branches nobody commits on. A list of branch names, each matched whole; `*` in a name
  # matches any text (`release/*`). It expands into one regular entry on pre_commit with the condition `branch`, an
  # anchored regular expression of the names (here `^(?:main|dev|release/.*)$`), whose message, in English, asks to
  # create a branch for the change.
  protected_branches:
    - main
    - dev
    - "release/*"
  # format_on_edit: the commands that format or lint each edited file. A list of maps with:
  # - run: required, the command, as the short form of the verb `run` takes it: a string split on spaces or a list
  #   of arguments, placeholders allowed ({path} is the edited file, and stays one argument);
  # - path: optional, a glob or a list, as the condition `path`: the item runs only on the edits of matching files;
  #   without it, it runs on every edited file;
  # - message: optional, the text before the output of a failure (placeholders allowed).
  # Each item expands into one entry on post_edit with `run`: it runs once per path and content, and a failure
  # reaches the AI as context, its message first. It also runs on each file a command changed (see post_edit).
  format_on_edit:
    # A string, with a message:
    - run: "golangci-lint fmt {path}"
      path: "*.go"
      message: "No se ha podido formatear {path}:"
    # A list of arguments, and a list of globs:
    - run: [npx, prettier, --write, --log-level, warn, "{path}"]
      path: ["*.ts", "*.tsx"]
  # run_on_stop: the commands that must pass before the main session ends its turn. A list of maps with:
  # - run: required, the command, as in format_on_edit;
  # - changed: optional, a glob or a list, as the condition `changed`: the item runs only when some file not
  #   committed yet matches; without it, on every turn;
  # - message: optional, the text before the output of a failure (placeholders allowed);
  # - wait_agents: optional, true by default: while subagents of the session are still running (in the background,
  #   or interrupted without their end reaching polix), the item is skipped and runs on the next stop after they
  #   end; false runs it whatever the subagents do. Another value is rejected by `polix config check`.
  # Each item expands into one entry on stop with `run`, in file order, before the entries of stop written in `on`:
  # while it fails the turn does not end (up to max_stop_retries), and it does not run again on a content it passed
  # on. An item that waits also gets `agents_are_running: false` in its `when`, and, when one waits, one `notify`
  # with `always` goes last on stop, after the entries written in `on`: every stop that holds a check back tells the
  # user once "run_on_stop waits for the subagents still running: its checks run on the next stop after they end."
  # A subagent ends with subagent_stop, where these entries never run (see `on`). Put first the check whose
  # failure makes the later ones pointless, and the cheaper one: here the lint before the tests.
  run_on_stop:
    # The lint is quick and its failures are worth fixing at once: it runs while subagents run too.
    - run: golangci-lint run ./...
      changed: ["src/**", "go.mod", "go.sum"]
      wait_agents: false
    - run: just test
      changed: "src/**"
      message: "Los tests no pasan: arréglalos antes de terminar."

# Placeholders, replaced in the strings of conditions (except `branch`), verbs and `contains`; an unknown one
# is rejected by `polix config check`:
# - {path}: the edited path, relative to the root (pre_edit and post_edit; empty elsewhere);
# - {command}: the whole command line (pre_command, post_command and pre_commit; empty elsewhere);
# - {branch}: the current branch;
# - {changed_lines}, {changed_files}, {risk_score}: the measures of the change not committed yet, over the files of
#   the `changed` of the `when` of the entry, else the whole change; `?` when git cannot measure it. The change is
#   only read when a string or a condition needs it;
# - {<var>}: each variable of `vars`.
# The placeholders of rules.run ({file}, {dir}, {id}, {name}, {names}, {files}, {dirs}) only exist there.
#
# Path globs (`path`, `changed`, `file`, `writes`, the items of `protected_files`, the `path` of `format_on_edit`
# and the `changed` of `run_on_stop`, risk.weights, rule scopes) are relative to the root and use `/`: `*` and `?`
# stay inside a segment, `**` crosses segments, a pattern without `/` also matches the base name anywhere (`*.md`
# matches docs/guide.md), and a leading `/` anchors it to the root (`/polix.yaml` is not examples/polix.yaml), like
# .gitignore. The whole path must match. On macOS and Windows the globs of `path` and `writes`, and those of
# `protected_files` and of the `path` of `format_on_edit`, ignore case.
#
# Command patterns (`command`, the `pattern` of `forbidden_commands`) match each command of the line as a whole,
# with surrounding spaces trimmed: `*` matches any text, spaces and slashes included, and `?` one character. So
# "just test" only matches the bare command, and "just test*" also matches `just test -k x` or `just test 2>&1`.
#
# Conditions that take a list (path, changed, file, command, writes, actor) hold when any item matches; those of
# finished and var hold when every item does. A single string is a list of one.
#
# agents_are_running: true or false, whether subagents of the session, of any type, are still running, the one that
# acts aside (on subagent_stop the subagent that stops does not count itself). It holds on any event, so a commit or
# the end of a turn can wait for every subagent: `when: { agents_are_running: false }`. polix counts them from the
# starts and ends of subagents in its log, corrected on each stop of Claude Code with the list of work still in
# flight it sends (an interrupted subagent missing from it counts as ended); a new session, a resume or a clear
# closes them all, a compaction does not. Codex sends no such list, so it counts by the log alone.

on:
  # Events, in lifecycle order. Each holds a list of entries, and an entry has two parts, when it applies and what
  # it does:
  #   when:   optional map of conditions; all must hold (no `when` always holds).
  #   unless: optional map of conditions; the entry is skipped when all hold (no `unless` never skips).
  #   action: required, a map with exactly one verb:
  #     run:    run a command, or the checks of the rules (see post_edit);
  #     inject: inject text for the AI (see start);
  #     block:  block the event with a message for the AI (see pre_edit);
  #     notify: show a message to the user, never to the AI (see prompt).
  # A YAML comment above the entry is the place for its reason, for people; the message of a block or a run is the
  # reason the AI reads.
  #
  # The shortcuts protected_branches, format_on_edit and run_on_stop add their entries to these events, before
  # the entries written here (see `guardrails`); `polix graph` draws each event with all of them, each named by its
  # shortcut. protected_files and forbidden_commands are no entries: they apply before all of them.
  #
  # The entries of `on` skip the edits outside the repository and of files git ignores: they govern the change, what
  # a commit may hold, so a build output, a local .env or a scratch file never fires them. Only the built-in
  # protection, protected_files and forbidden_commands reach an ignored file. A commit in another repository
  # (git -C ../other commit) skips the entries of pre_commit the same way.
  #
  # The first entry that actually blocks (a block, or a failing run on an event where a run blocks, not let through
  # by the loop guard) ends the evaluation of the event: the entries after it do not run, and those before it already
  # acted, so an inject before a block reaches the AI with it (on prompt, a rejected prompt never reaches the AI, so
  # that inject acts again on the next prompt). The order of the file is the priority: the AI gets one failure per
  # answer, the first one. Put first the gate whose failure makes the later ones pointless, and the cheaper one when
  # it does not matter. Two orders are rejected by `polix config check`, outside stop and subagent_stop for the first:
  # an entry after a block without when, unless nor once, which never runs; and, on every event, a notify before an
  # entry that may block it (a block, or a run where a run blocks), since a blocked event shows the user no message:
  # put the notice after the gates, or into the message of the block.
  #
  # How often each verb acts:
  # - block blocks every time its entry applies: a gate, which holds until its `unless` does. `once: true` makes it a
  #   reminder: it blocks the first attempt of an actor (the main session, or a subagent type) in a session on a
  #   content and lets the next one through; an edit inside the scope of the entry, another actor or a new session
  #   is reminded again. A reminder is for a request the agent may rightly decline; a gate that must hold has no
  #   `once`, since the agent would pass a reminder by trying again.
  # - run is not run again once it passed on the same branch and content (the same command, whoever's entry it is;
  #   {path} in it makes one command per path); a failing run runs again on the next event. `always: true` runs it
  #   every time, for a command whose result depends on more than the files (network, clock).
  # - inject reaches each actor once per session for each text it expands to, and again after the context is
  #   compacted or, for a subagent, on its next run. `always: true` injects it on every event. A text with a
  #   placeholder that changes on every event ({command}, a measure) is a new text, so it is injected every time;
  #   {path} gives once per path.
  # - notify reaches the user once per session for each entry and text it expands to, whatever the actor, and never
  #   again in that session, not even after a compaction. `always: true` shows it every time its entry applies.
  # The scope of an entry is the set of files the `changed` of its `when` names (the nearest `changed`, as the
  # measures take it), or the whole tree without one: `finished` and a `once` block compare only the files of that
  # scope, so an edit of README.md or docs/ keeps a review of `changed: "src/**"` and a reminder already given. Name
  # in `changed` every file the subagent reviews (go.mod is not "*.go").
  #
  # What polix remembers: its log (<git-dir>/polix/log.jsonl, read with `polix log`) holds a decision for each
  # answer, and an `observed` line only for what this file asks about: the end of a subagent a `finished` names,
  # a run of polix that passed, a block of a `once` entry or of a stop, an inject made once, a notice shown once and
  # the start of a session or of a subagent. When an inject acts once, or the file uses agents_are_running (an item
  # of run_on_stop that waits does), the end of any subagent is also written, without hash, so its next run gets the
  # inject again and it stops counting as running; `finished` never reads those lines. A command the AI runs is
  # never recorded and never counts as passed: polix cannot know what it really ran (an alias, another folder, a
  # command still running in the background). A check that must hold is a `run` of polix.
  #
  # Unknown events, keys (also inside action, run, inject, block, notify and vars), conditions and verbs are rejected
  # by `polix config check`, and so are conditions on events where they never hold (path, command, writes, exit). A
  # name of the old vocabulary (session_start, turn_stop, if, why, mode, deny, require, allow, run or context as keys
  # of an entry, record, done, at_least, and the top-level protected, base and max_stop_blocks) is reported with its
  # new spelling.

  # start: a session starts, resumes, is cleared or is compacted. It cannot be blocked: block is rejected, and a
  # failing run reaches the AI as context, its message first. On start every inject acts every time, so the context
  # survives a compaction, and `always` has no effect there.
  start:
    # inject: text for the AI. The short form is the text (placeholders allowed); the long form a map with exactly
    # one of:
    # - file: a file of the repository (placeholders allowed); a missing file injects nothing;
    # - text: a literal text (placeholders allowed);
    # - rules: the rules of rules.path whose scope matches a path (rules without scope match any path), each one
    #   injected once per actor and session, as "- <id>: <description>";
    # plus `always`.
    # Short form:
    - action:
        inject: "Rama {branch}: el flujo es ticket, plan, build, review y commit."
    # Long form with a file; with a placeholder, the plan of the ticket of the branch, when it exists:
    - action:
        inject:
          file: docs/flujo.md
    - when: { var: key }
      action:
        inject:
          file: "ai/plans/{key}-plan.md"
    # A run on start never blocks: when it fails, its message and output reach the AI as context. Not run again on
    # a content it passed on, unless `always` (here it depends on the machine, not on the files).
    - action:
        run:
          always: true
          command: polix doctor --offline
          message: "polix no está bien instalado en este equipo; avisa al usuario:"

  # prompt: the user sends a prompt. A block rejects the prompt before the model sees it; an inject adds context to
  # it.
  prompt:
    # var: every variable of the list has a value (a string is a list of one).
    # A warning repeated on every prompt is an inject with always: true.
    - unless: { var: key }
      action:
        inject:
          always: true
          text: "No hay ticket en la rama: créalo con /ticket antes de cambiar nada."
    # A variable without group: the whole branch name is the value.
    - when: { var: release }
      action:
        inject: "Rama de release {release}: solo se admiten fixes, ninguna funcionalidad nueva."
    # branch: the current branch matches a regular expression. It is not anchored: use ^ and $ for a whole match.
    # A block on prompt rejects it; with once: true, only the first prompt of the session, as a reminder.
    - when: { branch: "^(main|dev)$" }
      action:
        block:
          once: true
          message: "Estás en {branch}: crea una rama con /ticket antes de pedir cambios, o repite el prompt si solo es una consulta."
    # notify: a message for the user, shown by the agent, which never reaches the AI and costs it no context. The
    # short form is the message (placeholders allowed); the long form a map with `message` (required) and `always`.
    # Valid on every event, after the entries that may block it: a blocked event shows the user no message.
    - when: { var: release }
      action:
        notify: "Rama de release {release}: avisa a QA antes de publicar."

  # subagent_start: a subagent starts, with a new context; actor is its type. It cannot be blocked: block is rejected,
  # and a failing run reaches the subagent as context. As on start, every inject acts every time. It gets neither the
  # built-in guidance nor the requirements, told to the main session. path, command, writes and exit never hold here.
  # A subagent that only reads, such as a reviewer, never edits nor runs a command, so pre_edit never gives it the
  # rules: give them at its start.
  subagent_start:
    - when: { actor: polix:reviewer }
      action:
        inject: "Revisa el diff contra las reglas de ai/rules/: cada hallazgo cita el id de la regla que incumple."

  # pre_edit: before a file is edited, once per path. Conditions of the edit: path, actor. It also applies, after
  # the command, to each file a command changed (up to 25, see "Files a command changed" in docs/polix.md): there
  # the edit already happened, so a block or a failing run only reaches the AI as context.
  pre_edit:
    # block: block the event with a message for the AI. The short form is the message (placeholders allowed); the
    # long form a map with `message` (required) and `once`. Valid on prompt, pre_edit, pre_command, pre_commit,
    # stop and subagent_stop; the other events already happened.
    # Every change is tracked by a Jira ticket (short form):
    - unless: { var: key }
      action:
        block: "No hay ticket: crea la rama con /ticket"
    # An exception is a `not` in `when`, or a condition in `unless`: the plan is written before it exists.
    # path: the edited path matches a glob, or one of a list. Never holds outside pre_edit and post_edit.
    # not: a map of nested conditions; it holds unless every one of them holds (with one nested condition, it is its
    # negation).
    # file: a file of the repository, tracked or untracked but not ignored, matches a glob (or one of a list).
    - when: { not: { path: "ai/plans/{key}-*.md" } }
      unless: { file: "ai/plans/{key}-*.md" }
      action:
        block: "No hay plan: escríbelo con /plan"
    # file + contains: some matching file also holds this text (plain substring, placeholders allowed). contains is
    # only valid next to file, and never directly inside any, where it would hold on its own.
    - when: { not: { path: "ai/plans/{key}-*.md" } }
      unless: { file: "ai/plans/{key}-*.md", contains: "Ticket: {key}" }
      action:
        block: "El plan no tiene la línea Ticket: {key}"
    # actor: who acts, `session` (the main session) or the subagent type; a list holds when any matches. An agent of
    # a plugin is named with its prefix, `plugin:agent`, as polix:reviewer or acme:builder (a builder agent of a
    # plugin acme); an agent of .claude/agents/ by its bare name.
    # The main session orchestrates and only writes the plans and the docs; the builders build:
    - when: { not: { path: ["ai/plans/**", "docs/**"] } }
      unless: { actor: [acme:builder, acme:builder-ui] }
      action:
        block: "Solo los subagentes acme:builder y acme:builder-ui editan el proyecto: usa /build"
    # A not with several conditions holds unless all of them hold: here, any edit of a migration already merged,
    # except the main session adding a new one. A list in path holds when any glob matches.
    - when:
        path: ["db/migrations/**", "src/**/migrations/**"]
        not: { actor: session, file: "db/migrations/.allow-{key}" }
      action:
        block: "Las migraciones publicadas no se editan: crea una nueva con el ticket {key}."
    # A reminder on pre_edit: the first edit of a generated file by each actor is blocked once, the next goes
    # through.
    - when: { path: ["**/*.gen.go", "**/generated/**"] }
      action:
        block:
          once: true
          message: "{path} es un fichero generado: cambia su fuente y regenéralo; si de verdad hay que tocarlo, repite la edición."
    # inject the rules whose scope matches the edited path, each one once per actor and session.
    - action:
        inject:
          rules: "{path}"
    # inject with always: true reaches the AI on every edit of a matching path, not once per session.
    - when: { path: "src/auth/**" }
      action:
        inject:
          always: true
          text: "Código de autenticación: no registres secretos ni datos personales en los logs."

  # post_edit: after a file is edited, once per path, a file a command changed included (as pre_edit). It cannot
  # be blocked: block is rejected. A failing run reaches the AI as context, its message first: feedback the AI acts
  # on at once, not a gate.
  post_edit:
    # run: run a command from the root, without a shell (no pipes, redirections or globs). Every run of one hook
    # call shares a budget of 10 minutes; the timeout of the hook in the agent settings must be longer. The short
    # form is the command, a string split on spaces or a list of arguments (placeholders allowed in each, and
    # {path} stays one argument); the long form a map with exactly one of:
    # - command: the same command;
    # - rules: `changed` (the changed files) or a path such as "{path}": runs the check of every deterministic
    #   rule with a check whose scope matches; a failure names the rule ids and their output;
    # plus `message`, the text before the output of a failure (placeholders allowed), and `always`.
    # A failure answers with the message, a blank line and the last 15 lines of the output. On prompt, pre_edit,
    # pre_command, pre_commit, stop and subagent_stop it blocks, as a block does; on start, post_edit and
    # post_command it reaches the AI as context.
    # The formatters and linters of each edited file go to guardrails.format_on_edit, which expands into entries
    # like these; write an entry here for anything else after an edit, or when it needs more than a path: another
    # condition, `always` or the checks of the rules.
    # Short form, a string split on spaces: the code generated from a proto file, rebuilt after its edit.
    - when: { path: "proto/**/*.proto" }
      action:
        run: "buf generate"
    # Short form, a list of arguments, where each argument stays one ({path} too, even when it holds a space):
    - when: { path: "db/migrations/*.sql" }
      action:
        run: [sqlfluff, lint, --dialect, postgres, "{path}"]
    # Long form with command, message and always: the check asks the schema registry, so its result depends on more
    # than the files.
    - when: { path: "schemas/**/*.avsc" }
      action:
        run:
          always: true
          command: "just schema-compat {path}"
          message: "{path} rompe la compatibilidad con el registro de esquemas:"
    # Long form with rules: the checks of the rules whose scope matches the edited path.
    - when: { path: "checks/**" }
      action:
        run:
          rules: "{path}"
          message: "La check de {path} no pasa:"

  # pre_command: before a shell command runs. The line is split into its commands (`cd x && just test | tail -3`
  # gives `cd x`, `just test` and `tail -3`, quotes respected), and `command` holds when any of them matches.
  pre_command:
    # The commands no agent ever runs go to guardrails.forbidden_commands, which denies them before the entries of
    # this event; an entry here takes any condition, an exception in `unless` and any verb (see the warning and `any`
    # below).
    # command: a command of the line matches a pattern, or one of a list.
    - when: { command: ["git push*origin main*", "git push*origin HEAD:main*", "git push --force*", "git push -f*"] }
      action:
        block: "No se hace push directo a main ni push forzado: abre un PR"
    # A warning is an inject: the AI is told, nothing is blocked. With {command} in the text it is a new text on
    # every command, so it is injected every time.
    - when: { command: "terraform apply*", not: { branch: "^main$" } }
      action:
        inject: "Aviso: {command} solo se lanza desde el pipeline de main."
    # writes: a command of the line writes a path that matches a glob, or one of a list: the target of a
    # redirection into the repository, or a file named by a program that writes by itself (rm, mv, cp, tee,
    # sed -i...), which also matches on a folder holding it or a wildcard reaching it (`rm -rf ai` or `rm -rf ai/*`
    # for ai/rules/**). A heuristic: reads do not count, and `python -c` that opens a file is not seen. Only on
    # pre_command, post_command and pre_commit. With `actor`, only the subagents are kept away
    # (guardrails.protected_files keeps everybody).
    - when: { writes: ["polix.yaml", "ai/rules/**"], not: { actor: session } }
      action:
        block: "Solo la sesión principal cambia {command}"
    # any: a map of nested conditions; it holds when at least one of them holds. It may hold `not` (and sit in one).
    # finished holds on any event, here before a push: no push from a protected branch, nor of a change the reviewer
    # has not seen as it is now.
    - when:
        command: "git push*"
        any:
          branch: "^(main|dev)$"
          not: { finished: polix:reviewer }
      action:
        block: "No se hace push desde {branch} ni sin la revisión de polix:reviewer sobre el contenido actual."

  # post_command: after a shell command ran. It cannot be blocked: block is rejected. Whatever it ran, the command of
  # the AI never counts as a check that passed: a check that must hold is a run of polix (see pre_commit).
  post_command:
    # exit: the exit code of the line. Next to command, it only holds when a matching command decides the code of
    # the line: alone, last, or followed by && (`just test | tail` is decided by tail, so it never holds).
    # A command that failed to run (PostToolUseFailure) without an exit code counts as 1.
    # always: true tells the AI on every failure, not only the first one of the session.
    - when: { command: "just test*", exit: 1 }
      action:
        inject:
          always: true
          text: "Los tests fallan: arréglalos antes de seguir."
    # exit: 0 for what follows a command that worked. A run on post_command never blocks: when it fails, its message
    # and output reach the AI as context.
    - when: { command: ["npm install*", "npm i *"], exit: 0 }
      action:
        run:
          command: npm audit --audit-level=high
          message: "Las dependencias instaladas tienen vulnerabilidades altas:"

  # pre_commit: before a command line that holds a `git commit` runs; it comes right after its pre_command.
  # The commit on a protected branch is refused by guardrails.protected_branches, whose entry comes before these.
  pre_commit:
    # changed: some file not committed yet (changed since HEAD, or untracked and not ignored) matches a glob, or one
    # of a list. Secrets never land in a commit:
    - when: { changed: ["*.pem", "*.key", "*.p12", "*.pfx", "**/secrets/**"] }
      action:
        block: "El cambio incluye ficheros con secretos o certificados: sácalos del commit y añádelos a .gitignore."
    # A gate polix runs itself: the tests run before every commit, and not again on a content they passed on.
    - action:
        run:
          command: just test
          message: "Los tests no pasan sobre este diff:"
    # changed_lines, changed_files, risk_score: measures of the change not committed yet (the files of `changed`,
    # untracked ones whole), each a non-negative integer: the measure holds from that number up. They measure the
    # files of the nearest `changed` (in their own map, else in the enclosing one), else the whole change.
    # changed_lines sums added and deleted lines; changed_files counts files, deleted and binary included;
    # risk_score uses risk.weights. When git cannot measure the change they hold and the call warns (fail closed).
    # finished: every subagent type of the list (a string is a list of one) ended on this branch, its stop not
    # refused nor let through by the loop guard, and the files of the scope of the entry did not change since. polix
    # observes the end of the subagents a finished names by itself: no entry on subagent_stop is needed.
    # A gate released by finished: a small change of the source commits without a review; a large or risky one
    # waits for polix:reviewer, whose review survives an edit of README.md or docs/, outside the scope.
    - when:
        changed: "src/**"
        any:
          changed_lines: 150
          changed_files: 5
          risk_score: 25
      unless: { finished: polix:reviewer }
      action:
        block: "Cambio de {changed_lines} líneas en {changed_files} ficheros (riesgo {risk_score}): lanza el subagente polix:reviewer"
    # finished with a list: sensitive code waits for both reviews, each on the content as it is now.
    - when: { changed: ["src/auth/**", "src/crypto/**"] }
      unless: { finished: [polix:reviewer, acme:security-reviewer] }
      action:
        block: "El cambio toca código sensible: lanza polix:reviewer y acme:security-reviewer sobre el diff actual."
    # The changelog travels with the change: file + contains in unless.
    - when: { changed: "src/**" }
      unless: { file: CHANGELOG.md, contains: "{key}" }
      action:
        block: "Añade a CHANGELOG.md una entrada con {key} en este mismo commit."
    # A reminder: once: true blocks the first commit of each actor in a session on this content, and lets the next
    # one through. The docs it asks for are outside its scope, so editing them does not remind it again.
    - when: { changed: "src/**" }
      action:
        block:
          once: true
          message: "Revisa si README.md y docs/ deben cambiar con este diff; si no, repite el commit."

  # subagent_stop: a subagent is about to stop; actor is its type. A block keeps it working. Its entries never run
  # when the main session ends its turn. inject is rejected here.
  subagent_stop:
    # The builder does not finish until the tests pass: polix runs them, it never trusts that the builder ran them.
    - when: { actor: acme:builder, changed: "src/**" }
      action:
        run:
          command: just test
          message: "Los tests no pasan: arréglalos antes de terminar."
    # The reviewer does not finish without saving its report in the folder of reports.
    - when: { actor: polix:reviewer }
      unless: { file: "ai/reports/{key}-review*.md" }
      action:
        block: "Guarda tu informe en ai/reports/{key}-review.md antes de terminar."

  # stop: the main session is about to end its turn; actor is always `session`. A subagent ends with subagent_stop,
  # which never runs these entries. inject is rejected here and on subagent_stop: the agent cannot receive context
  # when it stops. The checks of guardrails.run_on_stop, the lint and the tests, come before these entries, and its
  # notice for the stops that hold the tests back while subagents run comes after them.
  stop:
    # run: { rules: changed }: the checks of the rules whose scope matches the changed files.
    - when: { changed: "**" }
      action:
        run:
          rules: changed
    # always: true runs it on every turn, also on a content it passed on: its result depends on more than the files.
    - when: { changed: "src/**" }
      action:
        run:
          always: true
          command: just test-integration
    # A reminder on stop, once per content: ask for the review at the end of the task.
    - when: { changed: "src/**" }
      unless: { finished: polix:reviewer }
      action:
        block:
          once: true
          message: "Lanza el subagente polix:reviewer sobre el diff actual"
