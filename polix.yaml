# Workflow of this repository, enforced by polix itself (dogfooding). Reference of every option:
# examples/polix.yaml; design and limits: docs/polix.md. Validate with `polix check`, draw with `polix graph`.
#
# The hooks of .claude/settings.json send every event to polix, but this workflow only acts on four of them:
# post_edit (format the edited Go file), pre_commit (a reminder to update README.md and docs/ once per change, and
# no commit of a large or risky change of Go code without a review), subagent_stop (record the review of
# polix:reviewer) and stop (lint and test before the turn ends). On the other events polix only applies its
# protections: the built-in one (no agent writes the state of polix) and the paths of `protected`.
#
# The review before a commit is asked only past a threshold of the uncommitted Go change: 150 changed lines, 5
# changed files or a risk score of 25, weighted by `risk.weights` below. Small changes commit without a review; lint
# and tests still run on every stop. Tune the thresholds and the weights with `polix risk --changed '*.go'`, and on
# the history with `polix risk --commit <rev> --changed '*.go'`.
version: 1
base: main
# A stop gate that keeps failing on the same content lets the agent stop after 3 blocks, so it never loops.
max_stop_blocks: 3

guidance:
  commit: true
  edit: true
  layout: true

# No agent writes the instructions of the repository, the main session included: only a person changes them.
protected: 
  - AGENTS.md
  - CLAUDE.md
  #- /polix.yaml


# The checks of ai/rules/ that are Go tests (the AST tests of tests/architecture/) run as one `go test` of their
# package, only the test named after the rule: GOARCH-4 runs TestGOARCH4.
rules:
  path: ai/rules
  run: { "*_test.go": [go, test, "{dir}", -run, "^Test{name}$"] }
plans:
  path: ai/plans
reports:
  path: ai/reports

# The weight of each path in the risk score of a change: the first glob that matches a file wins, and any other file
# weighs 1. Tests weigh least, even those of the core, so their globs come first; the hook engine and the state of
# polix are the core, and pkg/git feeds every fact of the hook.
risk:
  weights:
    "*_test.go": 0.5
    "tests/**": 0.5
    "internal/hook/**": 3
    "internal/state/**": 3
    "pkg/git/**": 2

on:
  # post_edit: after the agent edits a file, once per edited path.
  post_edit:
    # gofmt rewrites the edited Go file, so the agent never has to format by hand. In warn mode: the edit already
    # happened, and a failure (a syntax error) only reaches the agent as context. The lint of stop checks the
    # format of every file anyway.
    #- if: { path: "*.go" }
    #  mode: warn
    #  run: { command: ["gofmt", "-w", "{path}"] }
    - if: { path: "*.go" }
      mode: warn
      run: { command: ["golangci-lint", "fmt", "{path}"] }

  # pre_commit: before a git commit runs. A large or risky change of the Go code is committed only once
  # polix:reviewer reviewed that exact content; any later edit asks for a new review. The `changed` of the `if`
  # scopes the measures to the Go files, and a change git cannot measure asks for the review too. The deny does not
  # record: only subagent_stop records the fact.
  pre_commit:
    - if:
        changed: ["*.go", "go.mod", "go.sum"]
        any:
          changed_lines: { at_least: 150 }
          changed_files: { at_least: 5 }
          risk_score: { at_least: 25 }
      unless: { done: reviewed }
      why: no large or risky change of the Go code is committed without a review of its final diff
      deny: "This diff is not reviewed ({changed_lines} lines in {changed_files} Go files, risk score {risk_score}): run the polix:reviewer sub-agent on the current diff, wait for it to end without editing files, then commit again."

    # The docs are updated with the change: before a commit that changes the behaviour, the agent is asked once per
    # content to check whether README.md or docs/ must change. It comes after the review, whose deny stops the
    # evaluation, so it only asks once the diff is reviewed. The deny records docs, so a second commit on the same
    # content goes through.
    - if: { changed: ["*.go", "go.mod", "plugins/**", "examples/**", "polix.yaml", "install.sh", "install.ps1", "scripts/**"] }
      unless: { done: docs }
      why: every change of behaviour is documented in the same commit
      deny: "Before committing, check whether this change affects README.md or docs/ and update them. If it does not affect them, commit again."
      record: docs

  # subagent_stop: when a subagent ends. polix:reviewer never edits and the main session waits for it without
  # editing, so the content hash when it ends is the one it reviewed, and that content is recorded as reviewed.
  subagent_stop:
    - if: { actor: polix:reviewer }
      record: reviewed

  # stop: when the agent ends its turn. The entries run in order, and a failing one blocks the stop but does not
  # skip the next, so the agent gets every failure in one answer. Each one runs once per content: its fact
  # (linted, tested), in the record next to its run, is recorded when it passes, and `unless: done` skips it until
  # the files change again.
  stop:
    # golangci-lint with .golangci.yml over the whole module: the gofmt and goimports formatters, the standard
    # linters, govet (go vet) among them, and those of idiomatic Go. Only when a Go file or the lint configuration
    # changed.
    - if: { changed: ["*.go", "go.mod", "go.sum", ".golangci.yml"] }
      unless: { done: linted }
      run: { command: ["golangci-lint", "run", "./..."] }
      record: linted

    # Every test of the module, without the agent asking for it. The install scripts and scripts/ are tested from
    # Go, so a change in them runs the tests too. Go caches the results, so a run on code already tested is fast.
    - if: { changed: ["*.go", "go.mod", "go.sum", "install.sh", "install.ps1", "scripts/**"] }
      unless: { done: tested }
      run: { command: ["go", "test", "./..."] }
      record: tested
