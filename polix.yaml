---
version: 1
base_branch: main
# A stop gate that keeps failing on the same content lets the agent stop after 1 block.
max_stop_retries: 1

# The Go checks of ai/rules/ run as one `go test` of their package, only the test of the rule.
rules:
  path: ai/rules
  run: { "*_test.go": [go, test, "{dir}", -run, "^Test{name}$"] }

guidance:
  edit: false
  layout: false

# Weight of each path in the risk score: the first matching glob wins, any other file weighs 1.
risk:
  weights:
    "*_test.go": 0.5
    "tests/**": 0.5
    "internal/app/hook/**": 3
    "internal/app/state/**": 3
    "internal/platform/git/**": 2

# The programs run_on_stop and format_on_edit run: polix tells the AI on the first prompt when one is missing.
requirements:
  - go
  - golangci-lint

guardrails:
  # Only a person changes the instructions of the repository.
  protected_files:
    - AGENTS.md
    - CLAUDE.md

  # Format each edited Go file and this polix.yaml right after the edit.
  format_on_edit:
    - run: golangci-lint fmt {path}
      path: "*.go"
    - run: polix config fmt
      path: polix.yaml

  # Before the turn ends, in order; each check runs again only on new content.
  run_on_stop:
    # Lint the whole module when Go code or the lint configuration changes.
    - run: golangci-lint run ./...
      changed: ["*.go", "go.mod", "go.sum", ".golangci.yml"]
    # Run every test when Go code, the install scripts or scripts/ change.
    - run: go test ./...
      changed: ["*.go", "go.mod", "go.sum", "install.sh", "install.ps1", "scripts/**"]

# Entries run in file order after guardrails, and the first block ends the evaluation.
on:
  # This project commits straight to main: the agent never opens a branch on its own.
  start:
    - action:
        inject: |
          - Commit changes when work is done without ask user.
          - Commits in this project go directly to main: never create, switch to or push other branches.
          - Always push to remote after commit.

  # The builders and the reviewer start with a clean context: give them the habits the plan of each build needs.
  subagent_start:
    - when: { actor: polix:builder }
      action:
        inject: |
          - Edit files only with the Edit and Write tools: never with python, perl, sed or a heredoc from the shell.
          - Never run `just install` nor `just check`: they overwrite the polix binary the hooks of this session run.
    - when: { actor: polix:reviewer }
      action:
        inject: |
          - Never run `just install` nor `just check`: build the binary into a temporary folder and run it from there.

  # A plan of ai/plans/ is named by the date it is written and a kebab-case slug: YYYY-MM-DD-<slug>.md.
  pre_edit:
    - when:
        path: ai/plans/*.md
        not: { path: "ai/plans/????-??-??-*.md" }
      action:
        block: |
          The plan {path} does not follow the naming of ai/plans/: YYYY-MM-DD-<slug>.md, with the date it is written
          and a kebab-case slug, as ai/plans/2026-11-11-plan-file-names.md. Write it under that name.

  pre_commit:
    # Remind once per content to update README.md and docs/ when the behaviour changes.
    - when:
        actor: session
        changed: ["*.go", "go.mod", "plugins/**", "examples/**", "polix.yaml", "install.sh", "install.ps1", "scripts/**"]
      action:
        block:
          once: true
          message: |
            Before committing, check whether this change affects README.md, docs/**/*.md or internal/**/*.md and update them.
            Only Update Markdown files.
            If it does not affect them, commit again.

    # A large or risky Go change needs a review of polix:reviewer before the main session commits it. Subagents are
    # left out: a command of theirs that only quotes a git commit (a probe of the reviewer) counts as a commit too.
    - when:
        actor: session
        changed: ["*.go", "go.mod", "go.sum"]
        any:
          changed_lines: 150
          changed_files: 5
          risk_score: 25
      unless: { finished: polix:reviewer }
      action:
        block: |
          This diff is not reviewed ({changed_lines} lines in {changed_files} Go files, risk score {risk_score}).
          Run the polix:reviewer sub-agent on the current diff, wait for it to end without editing files, then commit again.

    # Tell the user what goes into main, after every entry that may block the commit.
    - when: { actor: session }
      action:
        notify: "Commit a main: {changed_lines} líneas en {changed_files} ficheros, riesgo {risk_score}."

  subagent_stop:
    - when: { actor: polix:reviewer }
      action:
        notify: "polix:reviewer ha terminado: ya puedes commitear."
