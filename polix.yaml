# Workflow of this repository, enforced by polix itself (dogfooding). Reference of every option:
# examples/polix.yaml; design and limits: docs/polix.md. Validate with `polix check`, draw with `polix graph`.
version: 1
base: main
max_stop_blocks: 3

on:
  # Format each Go file right after it is edited. A failure (a syntax error) reaches the agent as context.
  post_edit:
    - if: { path: "*.go" }
      mode: warn
      run: { command: ["gofmt", "-w", "{path}"] }

  # Only a full `just test` (vet + every test) counts as tested; `just test -run X` does not.
  post_command:
    - if: { command: ["just test", "just test 2>&1"], exit: 0 }
      record: tested

  # Deterministic rules of the changed files must pass before the turn ends.
  stop:
    # The formatter (GO-1) and the linter (GO-3, golangci-lint with .golangci.yml), once per content.
    - if: { changed: ["*.go", "go.mod", "go.sum", ".golangci.yml"] }
      unless: { done: formatted }
      run: { rules: changed, record: formatted }
    - if: { changed: ["*.go", "go.mod", "go.sum", ".golangci.yml"] }
      unless: { done: linted }
      run: { command: ["golangci-lint", "run", "./..."], record: linted }
    # The tests run on stop without the agent, once per content; a `just test` of the agent counts too.
    - if: { changed: ["*.go", "go.mod", "go.sum", "install.sh", "install.ps1", "scripts/**", "Justfile"] }
      unless: { done: tested }
      run: { command: ["just", "test"], record: tested }
