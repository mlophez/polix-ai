---
version: 1
requires: 0.11.0
base_branch: main

# The Go checks of ai/rules/ run as one `go test` of their package, only the test of the rule.
rules:
  run: { "*_test.go": [go, test, "{dir}", -run, "^Test{name}$"] }

# Weight of each path in the risk score: the first matching glob wins, any other file weighs 1.
risk:
  weights:
    "*_test.go": 0.5
    "tests/**": 0.5
    "internal/app/hook/**": 3
    "internal/app/state/**": 3
    "internal/platform/git/**": 2

# The programs check_on_stop, check_on_save and format_on_edit run: polix tells the AI on the first prompt when one is missing.
requirements:
  - go
  - golangci-lint

guardrails:
  # Only a person changes the instructions of the repository.
  protected_files:
    - AGENTS.md
    - CLAUDE.md

  # Commits and pull requests never credit Claude, in any line of the message or the body. A pattern holds on any
  # command that carries the phrase; `?` takes Co-Authored-By, Co-authored-by and co-authored-by.
  forbidden_commands:
    - pattern: "*?o-?uthored-?y: Claude*"
      reason: Remove the Co-Authored-By of Claude from the message of the commit or the pull request.

    - pattern: "*Generated with [Claude Code]*"
      reason: Remove the line Generated with Claude Code from the message of the commit or the pull request.

  # Format each edited Go file right after the edit; polix formats this polix.yaml and ai/rules/ by itself (builtin).
  format_on_edit:
    - run: golangci-lint fmt {path}
      path: "*.go"

  # Before the turn ends, in order; each check runs again only on new content. With also_on_save, git runs it on
  # every commit too, whoever makes it, a person included: a lint error or a failing test never lands.
  check_on_stop:
    # Lint the whole module when Go code or the lint configuration changes.
    - run: golangci-lint run ./...
      changed: ["*.go", "go.mod", "go.sum", ".golangci.yml"]
      also_on_save: true

    # Run every test when Go code, the install scripts or scripts/ change.
    - run: go test ./...
      changed: ["*.go", "go.mod", "go.sum", "install.sh", "install.ps1", "scripts/**"]
      also_on_save: true

# Entries run in file order after guardrails, and the first block ends the evaluation.
on:
  # The skills of polix are the workflow of this repository: the generic ones that overlap them only confuse the agent.
  start:
    - action:
        inject: |
          - Always push to remote after commit, except while /polix:build runs: it never pushes, so push its commits once it reports.
          - This repository has two flows and the user chooses which one: following a plan (polix:spec writes it, polix:build builds it) or editing the code directly, without a plan.
          - This repository plans, builds, reviews and audits with the skills of polix: polix:spec, polix:build, polix:review and polix:audit.
          - The generic skills that overlap them (engineering:code-review, engineering:architecture, engineering:system-design, engineering:testing-strategy, engineering:tech-debt, code-review, simplify) are not used here.

  # The builders and the verifier start with a clean context: give them the habits each build needs.
  # The reviewer runs nothing but git, so it needs none.
  subagent_start:
    - when: { actor: polix:builder }
      action:
        inject: |
          - Never run `just install` nor `just check`: they overwrite the polix binary the hooks of this session run.

    - when: { actor: polix:verifier }
      action:
        inject: |
          - Never run `just install` nor `just check`: when a `verify` runs polix, build it with `go build -o <temporary folder>/polix ./cmd/polix` and put that folder first on the PATH of that `verify`.

  pre_commit:
    # Only the main session commits: a subagent never does, whatever its type.
    - when: { not: { actor: session } }
      action:
        block: |
          Subagents never commit: leave the changes in the working tree and report them.
          The main session commits them.

    # Commit only once every subagent has ended: the gates below run only when none is running.
    - when: { actor: session, agents_are_running: true }
      action:
        block: |
          Subagents are still running: wait until all of them have finished before committing.
          Then commit again.

    # Remind once per content to update README.md and docs/ when the behaviour changes.
    #- when:
    #    actor: session
    #    changed: ["*.go", "go.mod", "plugins/**", "examples/**", "polix.yaml", "install.sh", "install.ps1", "scripts/**"]
    #  action:
    #    block:
    #      once: true
    #      message: |
    #        Before committing, check whether this change affects README.md, CHANGELOG.md, docs/**/*.md or internal/**/*.md and update them.
    #        Only Update Markdown files.
    #        If it does not affect them, commit again.

    # A large or risky Go change needs a review of polix:reviewer before the main session commits it. Subagents are
    # left out: a command of theirs that only quotes a git commit (a probe of the reviewer) counts as a commit too.
    # A change built by /polix:build already went through polix:builder, polix:verifier and polix:reviewer: the gate
    # stays released while HEAD has not moved since polix:builder ended, whatever changed after it, until the commit.
    - when:
        actor: session
        changed: ["*.go", "go.mod", "go.sum"]
        not: { finished_since_commit: polix:builder }
        any:
          changed_lines: 150
          changed_files: 5
          risk_score: 25
      unless: { finished: polix:reviewer }
      action:
        block: |
          This diff is not reviewed ({changed_lines} lines in {changed_files} Go files, risk score {risk_score}).
          1. Run the polix:reviewer sub-agent on the current diff.
          2. Wait for it to end without editing files.
          3. Fix important things.
          4. then commit again.

    # Tell the user what goes into main, after every entry that may block the commit.
    - when: { actor: session }
      action:
        notify: "Commit a main: {changed_lines} líneas en {changed_files} ficheros, riesgo {risk_score}."
